services:
  oniops:
    build: .
    image: oniops:latest
    container_name: oniops
    restart: unless-stopped
    ports:
      # Published on THIS machine only. Open http://localhost:8501
      - "127.0.0.1:8501:8501"
    environment:
      # Inside the container OniOps must listen on 0.0.0.0 for the port mapping
      # above to reach it. That is safe ONLY because the port is published on
      # 127.0.0.1. If you publish it on your network (e.g. "8501:8501") or use
      # network_mode: host, DELETE the next line and set auth.mode in
      # config.yaml - OniOps will then refuse to start without a login.
      ONIOPS_BIND_HOST: "0.0.0.0"
      ONIOPS_ALLOW_UNAUTHENTICATED_NETWORK: "1"
    volumes:
      # Your environment-specific files (kept out of the image / git):
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env:ro
      - ./secrets:/app/secrets:ro
      - ./data:/app/data
    # OniOps reaches your Kali host and LLMs over the network; if those live on
    # the Docker host's LAN, host networking is often simplest
    # (remove ONIOPS_ALLOW_UNAUTHENTICATED_NETWORK and enable a login first):
    # network_mode: host
