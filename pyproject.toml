[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oniops"
version = "0.4.3b0"
description = "ONIOPS — Offensive Neural Intelligence: a provider-agnostic autonomous red-team framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ares-369" }]
keywords = ["security", "red-team", "pentest", "offensive-security", "ai-agent", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Operating System :: OS Independent",
]
dependencies = [
    "flask>=3.0",
    "waitress>=3.0",
    "paramiko>=3.4",
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "urllib3>=2.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=0.3"]
openai = ["openai>=1.40"]
oidc = ["authlib>=1.3", "requests>=2.31"]
all = ["anthropic>=0.40", "google-genai>=0.3", "openai>=1.40", "authlib>=1.3"]

[project.scripts]
oniops = "oniops.cli:cli_main"

[project.urls]
Homepage = "https://github.com/ares-369/oniops"
Repository = "https://github.com/ares-369/oniops"
Issues = "https://github.com/ares-369/oniops/issues"

[tool.setuptools.packages.find]
include = ["oniops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled pragmatically (prompts/templates)
    "E402",   # module-level imports after dotenv/config bootstrap in webui.py
    "E701",   # compact single-line statements in parsers
    "E702",   # compact semicolon statements
    "E741",   # short comprehension loop vars
    "RUF005", # list concatenation in prompt assembly
    "RUF012", # lightweight stub classes in tests
    "SIM105", # contextlib.suppress vs explicit try/except
    "SIM108", # ternary operator preference
]

