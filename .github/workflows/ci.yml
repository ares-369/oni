name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint with Ruff
        run: ruff check oniops/ webui.py tests/

      - name: Compile check
        run: python -m py_compile webui.py oniops/*.py oniops/providers/*.py

      - name: Run unit tests
        run: pytest tests/ -v

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  browser-integration:
    name: Browser Integration (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest playwright
          python -m playwright install --with-deps chromium

      - name: Run loopback browser integration checks
        run: pytest tests/test_browser_runtime.py -v

  scanner-worker:
    name: Scanner Worker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build disposable scanner image
        run: docker build --file Dockerfile.worker --tag oniops-worker:ci .

      - name: Verify worker bootstrap and Nmap startup
        run: |
          worker_args="--read-only --cap-drop=ALL --cap-add=NET_ADMIN --security-opt=no-new-privileges --pids-limit=64 --memory=512m --cpus=1 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m --env HOME=/tmp --env TMPDIR=/tmp --env ONIOPS_WORKER_UID_GID=65534:65534"
          docker run --rm --network none $worker_args --env ONIOPS_SCOPE_CIDRS=127.0.0.1/32 oniops-worker:ci nmap --version

      - name: Verify Nuclei startup in the worker
        run: |
          worker_args="--read-only --cap-drop=ALL --cap-add=NET_ADMIN --security-opt=no-new-privileges --pids-limit=64 --memory=512m --cpus=1 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m --env HOME=/tmp --env TMPDIR=/tmp --env ONIOPS_WORKER_UID_GID=65534:65534"
          docker run --rm --network none $worker_args --env ONIOPS_SCOPE_CIDRS=127.0.0.1/32 oniops-worker:ci nuclei -version

      - name: Set up isolated egress test targets
        run: |
          docker network create oniops-worker-net >/dev/null
          docker run -d --name oniops-scope-allowed --network oniops-worker-net \
            --entrypoint python3 oniops-worker:ci -m http.server 8000 --bind 0.0.0.0 >/dev/null
          docker run -d --name oniops-scope-denied --network oniops-worker-net \
            --entrypoint python3 oniops-worker:ci -m http.server 8000 --bind 0.0.0.0 >/dev/null
          allowed_ip=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' oniops-scope-allowed)
          denied_ip=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' oniops-scope-denied)
          echo "ONIOPS_ALLOWED_IP=$allowed_ip" >> "$GITHUB_ENV"
          echo "ONIOPS_DENIED_IP=$denied_ip" >> "$GITHUB_ENV"

      - name: Allow an in-scope container target
        run: |
          worker_args="--read-only --cap-drop=ALL --cap-add=NET_ADMIN --security-opt=no-new-privileges --pids-limit=64 --memory=512m --cpus=1 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m --env HOME=/tmp --env TMPDIR=/tmp --env ONIOPS_WORKER_UID_GID=65534:65534"
          docker run --rm --network oniops-worker-net $worker_args --env ONIOPS_SCOPE_CIDRS="$ONIOPS_ALLOWED_IP/32" \
            oniops-worker:ci curl --fail --max-time 3 "http://$ONIOPS_ALLOWED_IP:8000/"

      - name: Block an out-of-scope container target
        run: |
          worker_args="--read-only --cap-drop=ALL --cap-add=NET_ADMIN --security-opt=no-new-privileges --pids-limit=64 --memory=512m --cpus=1 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m --env HOME=/tmp --env TMPDIR=/tmp --env ONIOPS_WORKER_UID_GID=65534:65534"
          if docker run --rm --network oniops-worker-net $worker_args --env ONIOPS_SCOPE_CIDRS="$ONIOPS_ALLOWED_IP/32" \
            oniops-worker:ci curl --fail --connect-timeout 2 --max-time 3 "http://$ONIOPS_DENIED_IP:8000/"; then
            echo "worker reached an out-of-scope container"
            exit 1
          fi

      - name: Clean up egress test targets
        if: always()
        run: |
          docker rm -f oniops-scope-allowed oniops-scope-denied >/dev/null 2>&1 || true
          docker network rm oniops-worker-net >/dev/null 2>&1 || true
