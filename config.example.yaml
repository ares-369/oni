# =====================================================================
#  ONIOPS — Offensive Neural Intelligence
#  Copy this file to  config.yaml  and edit for YOUR environment.
#  Secrets (API keys) go in  .env , never here.
# =====================================================================

oniops:
  instance_name: "ONIOPS"
  bind_host: "0.0.0.0"        # listen address for the web UI
  bind_port: 8501

# ---------------------------------------------------------------------
#  Rules of Engagement (scope). REQUIRED.
#  ONIOPS refuses to touch anything outside allowed_cidrs. There is NO
#  implicit internet default — you must list what you are allowed to test.
# ---------------------------------------------------------------------
scope:
  allowed_cidrs:
    - "192.168.1.0/24"       # <-- change to YOUR network(s)
  exclude:                   # never touched, even if inside allowed_cidrs
    - "192.168.1.1"          # e.g. your gateway/router
  auto_detect_subnet: true   # on first run, offer this host's own subnet
  rate_limit_per_min: 120
  mode: "active"             # active | passive | stealth
  non_destructive: true      # hard-block destructive tool flags (keep true)
  # active_window: "22:00-06:00"   # optional: only scan in this local window

# ---------------------------------------------------------------------
#  Attack host — the Kali (or any tooled Linux) box ONIOPS drives over SSH.
#  ONIOPS connects with paramiko, so no local ssh client is needed (works on
#  Windows too). Point ssh_key at a PRIVATE key the Kali host trusts.
# ---------------------------------------------------------------------
kali:
  host: "192.168.1.50"       # <-- your Kali host
  user: "root"
  ssh_key: "./secrets/kali_id_rsa"   # keep OUT of git (secrets/ is ignored)
  connect_timeout: 6
  verify_host_key: "tofu"    # tofu (trust-on-first-use) | strict | insecure
  known_hosts: "./secrets/known_hosts"

# ---------------------------------------------------------------------
#  Authentication for the ONIOPS web UI. OFF by default. STRONGLY recommended
#  whenever the UI is reachable beyond localhost — it can drive the attack
#  host. For production, running ONIOPS behind a TLS reverse proxy (nginx /
#  Caddy / Traefik / NPM) is recommended; use mode "proxy" with forward-auth
#  (e.g. Authentik), or "oidc" to let ONIOPS do SSO itself.
#
#  mode: none | basic | local | oidc | proxy
#    none   - no login (default)
#    basic  - HTTP Basic (single operator)
#    local  - built-in login page + session (set password_hash, or
#             ONIOPS_AUTH_PASSWORD in .env; and ONIOPS_SECRET_KEY in .env)
#    oidc   - SSO via ANY OpenID Connect provider (Authentik, Keycloak,
#             Google, Azure AD, Okta...). Needs: pip install 'oniops[oidc]'
#    proxy  - trust a reverse-proxy forward-auth header
# ---------------------------------------------------------------------
auth:
  mode: "none"
  username: "oniops"
  # password_hash: "pbkdf2_sha256$..."   # generate: python -c "from oniops.auth import hash_password;print(hash_password('yourpw'))"
  proxy_header: "X-Forwarded-User"        # for mode: proxy (e.g. X-authentik-username)
  proxy_trusted_ips: []                    # for mode: proxy — only these source IPs may assert the header
                                           # (anti-forgery; set to your reverse proxy's IP, e.g. ["10.0.0.151"])
  allowed_users: []                        # optional allowlist (oidc/proxy); empty = any authenticated
  oidc:                                    # for mode: oidc
    issuer: ""                             # e.g. https://auth.example.com/application/o/oniops/
    client_id: ""
    # client_secret comes from .env OIDC_CLIENT_SECRET
    scopes: "openid email profile"
    username_claim: "email"

# ---------------------------------------------------------------------
#  LLM providers. Mix and match freely — any provider can fill any role.
#  Set only the ones you use. Ollama is local and needs no API key.
# ---------------------------------------------------------------------
llm:
  roles:
    planner:  { provider: "ollama", model: "qwen2.5-coder:7b" }
    reporter: { provider: "ollama", model: "qwen2.5-coder:7b" }
    reason:   { provider: "ollama", model: "deepseek-r1:1.5b" }
  providers:
    ollama:
      base_url: "http://localhost:11434"
    anthropic:
      default_model: "claude-sonnet-4-5"      # ANTHROPIC_API_KEY in .env
    gemini:
      default_model: "gemini-2.5-pro"         # GEMINI_API_KEY in .env
    openai:
      default_model: "gpt-4.1"                # OPENAI_API_KEY in .env
    azure_openai:
      base_url: ""                            # AZURE_OPENAI_API_KEY in .env
      api_version: "2024-10-21"
    openai_compatible:                        # vLLM / LM Studio / OpenRouter
      base_url: "http://localhost:8000/v1"    # OPENAI_COMPAT_API_KEY in .env
      default_model: ""

# ---------------------------------------------------------------------
#  Optional integrations (disabled unless enabled + configured).
# ---------------------------------------------------------------------
integrations:
  misp:
    enabled: false
    host: ""                 # e.g. https://misp.local   (MISP_API_KEY in .env)
    verify_tls: false
  caldera:
    enabled: false
    host: ""                 # e.g. http://caldera.local:8888  (CALDERA_API_KEY in .env)
