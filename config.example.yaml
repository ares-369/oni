# =====================================================================
#  OniOps — Offensive Neural Intelligence
#  Copy this file to  config.yaml  and edit for YOUR environment.
#  Secrets (API keys) go in  .env , never here.
# =====================================================================

oniops:
  instance_name: "OniOps"
  # Listen address for the web UI. 127.0.0.1 = this machine only (safe default).
  # To reach OniOps from other machines, set 0.0.0.0 AND enable a login below
  # (auth.mode) - OniOps refuses to start on a network address with no login.
  bind_host: "127.0.0.1"
  bind_port: 8501
  # Only set this if access is already restricted another way (e.g. Docker
  # publishing the port on 127.0.0.1 only). Never on an open network.
  # allow_unauthenticated_network: false
  # Public base URL when behind a reverse proxy (used for OIDC redirect URIs).
  # external_url: "https://oniops.example.com"

# ---------------------------------------------------------------------
#  Rules of Engagement (scope). REQUIRED.
#  OniOps refuses to touch anything outside allowed_cidrs. There is NO
#  implicit internet default — you must list what you are allowed to test.
# ---------------------------------------------------------------------
scope:
  allowed_cidrs:
    - "192.168.1.0/24"       # <-- change to YOUR network(s)
  exclude:                   # never touched, even if inside allowed_cidrs
    - "192.168.1.1"          # e.g. your gateway/router
  auto_detect_subnet: true   # on first run, offer this host's own subnet
  # Pacing per target: max commands / HTTP requests OniOps launches toward
  # any ONE target per minute (one nmap, curl or AI probe request = 1). This is
  # not a packet limit: a single nmap or nikto run still sends many packets.
  # Commands that touch no target (searchsploit, local bookkeeping) are free.
  rate_limit_per_min: 120
  mode: "active"             # active | passive | stealth
  non_destructive: true      # hard-block destructive tool flags (keep true)
  allow_intrusive_playbooks: false # require explicit opt-in for packs using sqlmap/hydra
  # active_window: "22:00-06:00"   # optional: only scan in this local window

# ---------------------------------------------------------------------
#  Attack host — the Kali (or any tooled Linux) box OniOps drives over SSH.
#  OniOps connects with paramiko, so no local ssh client is needed (works on
#  Windows too). Point ssh_key at a PRIVATE key the Kali host trusts.
# ---------------------------------------------------------------------
# Single attack host (simplest). OniOps can drive any SSH-reachable tooled Linux —
# Kali, Parrot, BlackArch, or your own box (even localhost if OniOps runs on it).
kali:
  host: "192.168.1.50"       # <-- your attack host
  user: "root"
  ssh_key: "./secrets/kali_id_rsa"   # keep OUT of git (secrets/ is ignored)
  connect_timeout: 6
  verify_host_key: "tofu"    # tofu (trust-on-first-use) | strict | insecure
  known_hosts: "./data/known_hosts"   # host keys are saved here (data/ is writable, also under Docker)
  # Optional: launch each scanner command in a disposable, resource-limited
  # Docker container on the attack host. Build/provide an image containing the
  # tools used by your selected playbooks. The default SSH mode remains above.
  # execution_mode: "docker"
  # worker_image: "your-registry/oniops-worker:stable"
  # worker_network: "oniops-worker-net" # pre-create with `docker network create oniops-worker-net`
  # worker_memory_mb: 1024
  # worker_cpus: 2
  # worker_pids_limit: 256
  # worker_user: "65534:65534"

# ...OR define MULTIPLE attack hosts and switch between them in the UI (Settings).
# If present, attack_hosts takes precedence over the single `kali:` block above.
# attack_hosts:
#   - name: "kali"
#     label: "Kali (lab)"
#     host: "192.168.1.50"
#     user: "root"
#     ssh_key: "./secrets/kali_id_rsa"
#     default: true
#   - name: "parrot"
#     label: "Parrot (DMZ)"
#     host: "192.168.1.51"
#     user: "ops"
#     ssh_key: "./secrets/parrot_id_rsa"

# ---------------------------------------------------------------------
#  Optional: per-role TARGET login recipes (primary / low_priv / peer), so ONIOPS
#  can log in to the target and refresh short-lived tokens mid-scan instead of
#  using one fixed header. Credentials are referenced ONLY as ${ENV_VAR} and
#  resolved at login time; they never reach findings, logs or reports.
#  Full json_login / form_login examples (VAmPI, Juice Shop, DVWA) are in
#  docs/TARGET_AUTH.md. Leave this out for the classic static-header behaviour.
# ---------------------------------------------------------------------
# target_auth:
#   low_priv:
#     type: json_login
#     login_url: "http://TARGET:5000/users/v1/login"
#     json_body: { username: "${ONIOPS_TARGET_LOW_USER}", password: "${ONIOPS_TARGET_LOW_PASS}" }
#     token_path: "auth_token"
#     header_template: "Authorization: Bearer {token}"

# ---------------------------------------------------------------------
#  Authentication for the OniOps web UI. OFF by default. STRONGLY recommended
#  whenever the UI is reachable beyond localhost — it can drive the attack
#  host. For production, running OniOps behind a TLS reverse proxy (nginx /
#  Caddy / Traefik / NPM) is recommended; use mode "proxy" with forward-auth
#  (e.g. Authentik), or "oidc" to let OniOps do SSO itself.
#
#  mode: none | basic | local | oidc | proxy
#    none   - no login (default; only allowed while bind_host is 127.0.0.1)
#    basic  - HTTP Basic (single operator)
#    local  - built-in login page + session (set password_hash, or
#             ONIOPS_AUTH_PASSWORD in .env; and ONIOPS_SECRET_KEY in .env)
#    oidc   - SSO via ANY OpenID Connect provider (Authentik, Keycloak,
#             Google, Azure AD, Okta...). Needs: pip install 'oniops[oidc]'
#    proxy  - trust a reverse-proxy forward-auth header
#             (REQUIRES proxy_trusted_ips, or OniOps refuses to start)
# ---------------------------------------------------------------------
auth:
  mode: "none"
  username: "oniops"
  # password_hash: "pbkdf2_sha256$..."   # generate: python -c "from oniops.auth import hash_password;print(hash_password('yourpw'))"
  proxy_header: "X-Forwarded-User"        # for mode: proxy (e.g. X-authentik-username)
  proxy_trusted_ips: []                    # REQUIRED for mode: proxy — only these source IPs may assert the
                                           # header (your reverse proxy's IP, e.g. ["10.0.0.151"]). Empty =
                                           # OniOps refuses to start, because anyone could forge the header.
  allowed_users: []                        # optional allowlist (oidc/proxy); empty = any authenticated
  oidc:                                    # for mode: oidc
    issuer: ""                             # e.g. https://auth.example.com/application/o/oniops/
    client_id: ""
    # client_secret comes from .env OIDC_CLIENT_SECRET
    scopes: "openid email profile"
    username_claim: "email"

# ---------------------------------------------------------------------
#  LLM providers. Mix and match freely — any provider can fill any role.
#  Set only the ones you use. Ollama is local and needs no API key.
# ---------------------------------------------------------------------
llm:
  roles:
    planner:  { provider: "ollama", model: "qwen2.5-coder:7b" }
    reporter: { provider: "ollama", model: "qwen2.5-coder:7b" }
    reason:   { provider: "ollama", model: "deepseek-r1:1.5b" }
  providers:
    ollama:
      base_url: "http://localhost:11434"
    anthropic:
      default_model: "claude-sonnet-4-5"      # ANTHROPIC_API_KEY in .env
    gemini:
      default_model: "gemini-2.5-pro"         # GEMINI_API_KEY in .env
    openai:
      default_model: "gpt-4.1"                # OPENAI_API_KEY in .env
    azure_openai:
      base_url: ""                            # AZURE_OPENAI_API_KEY in .env
      api_version: "2024-10-21"
    openai_compatible:                        # vLLM / LM Studio / OpenRouter
      base_url: "http://localhost:8000/v1"    # OPENAI_COMPAT_API_KEY in .env
      default_model: ""

# ---------------------------------------------------------------------
#  Optional integrations (disabled unless enabled + configured).
# ---------------------------------------------------------------------
integrations:
  misp:
    enabled: false
    host: ""                 # e.g. https://misp.local   (MISP_API_KEY in .env)
    verify_tls: false
  caldera:
    enabled: false
    host: ""                 # e.g. http://caldera.local:8888  (CALDERA_API_KEY in .env)
  nvd:
    # CVE enrichment. searchsploit (Exploit-DB, on the attack host) is used
    # offline regardless. Enabling this additionally resolves detected
    # product+version into CVE IDs + CVSS via the free public NVD API
    # (nvd.nist.gov). No MISP / threat-intel server required. Best-effort:
    # if NVD is unreachable, results fall back to offline searchsploit only.
    enabled: false
    api_key: ""              # optional; only raises NVD rate limits
